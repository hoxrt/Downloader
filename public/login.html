<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VideoVault — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      :root {
        --bg: #06090f;
        --card: rgba(16, 24, 37, 0.85);
        --border: rgba(255, 255, 255, 0.08);
        --accent: #7b6eff;
        --glow: rgba(123, 110, 255, 0.35);
        --sub: rgba(123, 110, 255, 0.13);
        --text-1: #eef2ff;
        --text-2: #8892b0;
        --text-3: #445070;
        --error: #ff6b8a;
        --success: #22d3a0;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text-1);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            ellipse 70% 60% at 30% 20%,
            rgba(123, 110, 255, 0.13) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse 50% 50% at 70% 80%,
            rgba(0, 229, 212, 0.07) 0%,
            transparent 55%
          );
        pointer-events: none;
      }

      .card {
        background: var(--card);
        backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 44px 40px;
        width: 100%;
        max-width: 420px;
        position: relative;
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.6);
        animation: fadeInUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      /* Glowing top border */
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 15%;
        right: 15%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        border-radius: 99px;
        opacity: 0.7;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(28px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: 1.5rem;
        letter-spacing: -0.03em;
        margin-bottom: 8px;
      }
      .logo-icon {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #7b6eff, #5b9eff);
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 0.95rem;
        color: white;
        box-shadow: 0 6px 20px var(--glow);
      }
      .subtitle {
        text-align: center;
        color: var(--text-2);
        font-size: 0.88rem;
        margin-bottom: 32px;
      }

      .form-group {
        margin-bottom: 16px;
      }
      .form-label {
        display: block;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text-2);
        margin-bottom: 7px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .input-wrap {
        position: relative;
      }
      .input-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-3);
        font-size: 0.85rem;
        pointer-events: none;
        transition: color 0.2s;
      }
      .input-wrap:focus-within .input-icon {
        color: var(--accent);
      }
      .pw-toggle {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-3);
        cursor: pointer;
        font-size: 0.85rem;
        transition: color 0.2s;
        padding: 4px;
      }
      .pw-toggle:hover {
        color: var(--text-1);
      }

      input[type="password"],
      input[type="text"] {
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1.5px solid var(--border);
        border-radius: 999px;
        padding: 14px 44px 14px 42px;
        color: var(--text-1);
        font-family: "DM Sans", sans-serif;
        font-size: 0.92rem;
        outline: none;
        transition:
          border-color 0.25s,
          background 0.25s,
          box-shadow 0.25s;
      }
      input:focus {
        border-color: var(--accent);
        background: rgba(123, 110, 255, 0.07);
        box-shadow:
          0 0 0 3px var(--sub),
          0 0 20px rgba(123, 110, 255, 0.1);
      }
      input.error {
        border-color: var(--error);
        box-shadow: 0 0 0 3px rgba(255, 107, 138, 0.12);
      }

      .btn-login {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #7b6eff, #5b9eff);
        border: none;
        border-radius: 999px;
        color: white;
        font-family: "DM Sans", sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
        box-shadow: 0 6px 28px var(--glow);
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 36px var(--glow);
      }
      .btn-login:active {
        transform: scale(0.97);
      }
      .btn-login:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none !important;
      }

      .error-msg {
        display: none;
        align-items: center;
        gap: 7px;
        background: rgba(255, 107, 138, 0.1);
        border: 1px solid rgba(255, 107, 138, 0.25);
        color: var(--error);
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 0.82rem;
        font-weight: 500;
        margin-top: 12px;
      }
      .error-msg.visible {
        display: flex;
        animation: shake 0.4s ease;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-8px);
        }
        40% {
          transform: translateX(8px);
        }
        60% {
          transform: translateX(-5px);
        }
        80% {
          transform: translateX(5px);
        }
      }

      .footer-note {
        text-align: center;
        font-size: 0.75rem;
        color: var(--text-3);
        margin-top: 24px;
      }

      @media (max-width: 480px) {
        .card {
          padding: 32px 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <span class="logo-icon"><i class="fa-solid fa-bolt"></i></span>
        VideoVault
      </div>
      <p class="subtitle">Enter the password to continue</p>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock input-icon"></i>
          <input
            type="password"
            id="password"
            placeholder="Enter password…"
            autocomplete="current-password"
          />
          <button class="pw-toggle" onclick="togglePw()" tabindex="-1">
            <i class="fa-regular fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <button class="btn-login" id="loginBtn" onclick="login()">
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
        Enter VideoVault
      </button>

      <div class="error-msg" id="errorMsg">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="errorText">Incorrect password. Try again.</span>
      </div>

      <p class="footer-note">Private access only</p>
    </div>

    <script>
      // Enter key triggers login
      document.getElementById("password").addEventListener("keydown", (e) => {
        if (e.key === "Enter") login();
      });

      // Toggle password visibility
      function togglePw() {
        const input = document.getElementById("password");
        const icon = document.getElementById("eyeIcon");
        if (input.type === "password") {
          input.type = "text";
          icon.className = "fa-regular fa-eye-slash";
        } else {
          input.type = "password";
          icon.className = "fa-regular fa-eye";
        }
      }

      async function login() {
        const pw = document.getElementById("password").value.trim();
        const btn = document.getElementById("loginBtn");
        const errMsg = document.getElementById("errorMsg");
        const input = document.getElementById("password");

        if (!pw) {
          input.classList.add("error");
          errMsg.querySelector("#errorText").textContent =
            "Please enter the password.";
          errMsg.classList.add("visible");
          return;
        }

        btn.disabled = true;
        btn.innerHTML =
          '<i class="fa-solid fa-circle-notch fa-spin"></i> Checking…';
        input.classList.remove("error");
        errMsg.classList.remove("visible");

        try {
          const res = await fetch("/auth", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: pw }),
          });

          if (res.ok) {
            btn.innerHTML =
              '<i class="fa-solid fa-circle-check"></i> Access Granted!';
            btn.style.background = "linear-gradient(135deg, #22D3A0, #00E5D4)";
            setTimeout(() => (window.location.href = "/"), 700);
          } else if (res.status === 429) {
            // محظور بسبب محاولات كثيرة
            document.getElementById("errorText").textContent =
              "Too many attempts. Try again in 15 minutes.";
            errMsg.classList.add("visible");
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-ban"></i> Blocked';
            btn.style.background = "linear-gradient(135deg, #FF6B8A, #FF4444)";
            // countdown timer
            let seconds = 15 * 60;
            const countdown = setInterval(() => {
              seconds--;
              const m = Math.floor(seconds / 60);
              const s = seconds % 60;
              btn.innerHTML = `<i class="fa-solid fa-clock"></i> Wait ${m}:${String(s).padStart(2, "0")}`;
              if (seconds <= 0) {
                clearInterval(countdown);
                btn.disabled = false;
                btn.innerHTML =
                  '<i class="fa-solid fa-arrow-right-to-bracket"></i> Enter VideoVault';
                btn.style.background = "";
                document.getElementById("errorText").textContent =
                  "You can try again now.";
              }
            }, 1000);
          } else {
            input.classList.add("error");
            input.value = "";
            input.focus();
            document.getElementById("errorText").textContent =
              "Incorrect password. Try again.";
            errMsg.classList.add("visible");
            btn.disabled = false;
            btn.innerHTML =
              '<i class="fa-solid fa-arrow-right-to-bracket"></i> Enter VideoVault';
          }
        } catch {
          input.classList.add("error");
          input.value = "";
          input.focus();
          document.getElementById("errorText").textContent =
            "Something went wrong. Try again.";
          errMsg.classList.add("visible");
          btn.disabled = false;
          btn.innerHTML =
            '<i class="fa-solid fa-arrow-right-to-bracket"></i> Enter VideoVault';
        }
      }
    </script>
  </body>
</html>
